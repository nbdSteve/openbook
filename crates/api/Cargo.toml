[package]
name = "openbook-api"
description = "Openbook HTTP API: axum routes, SSE chat, Lambda and local entry points"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
openbook-core.workspace = true
openbook-search = { workspace = true, features = ["bm25"] }
axum.workspace = true
aws-sdk-s3.workspace = true
chrono.workspace = true
futures.workspace = true
lambda_http.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
base64 = "0.23"
aws-config.workspace = true
aws-credential-types.workspace = true
aws-sdk-cognitoidentityprovider = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-dynamodb.workspace = true
aws-sdk-s3.workspace = true
aws-sdk-s3vectors.workspace = true
aws-sdk-sqs.workspace = true
http-body-util.workspace = true
tokio = { workspace = true, features = ["test-util"] }
reqwest.workspace = true
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
