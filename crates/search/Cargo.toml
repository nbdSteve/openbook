[package]
name = "openbook-search"
description = "Openbook search: Markdown chunker, embeddings, S3 Vectors store, and the course BM25 index"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["bm25"]
# The Tantivy index. The API needs only the vector store (to delete a course index), so it turns this off.
bm25 = ["dep:tantivy", "dep:tar", "dep:zstd"]

[dependencies]
openbook-core.workspace = true
async-trait.workspace = true
aws-config.workspace = true
aws-sdk-bedrockruntime.workspace = true
aws-sdk-s3.workspace = true
aws-sdk-s3vectors.workspace = true
aws-smithy-types.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tantivy = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zstd = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
