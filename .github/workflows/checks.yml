# The gate every change passes before it is merged, and again on the exact commit that deploys.
#
# `pull_request` runs it for every pull request. `workflow_call` lets deploy.yml run the same
# jobs first, on the commit that it is about to deploy, and `need` them. There is no `push`
# trigger: a push to main runs these jobs through deploy.yml, so no run is duplicated.
#
# Nothing here needs AWS credentials, and no job can ask for an OIDC token, so a pull request
# from a fork can run the whole gate and still reach nothing. Third-party actions are pinned
# to full commit SHAs (the tag is in the comment).
name: checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  # Only a newer push to the same pull request may cancel older checks. A deploy run never
  # cancels its own gate.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The emulator image comes from the latest LTS RPM. Docker builds it fresh on every run.
  EMULATOR_IMAGE: aws-emulator
  # The cargo-lambda version, and the Zig linker that it needs. Keep both in step with deploy.yml.
  CARGO_LAMBDA_VERSION: '1.9.2'
  ZIGLANG_VERSION: '0.17.1'

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the toolchain, its components, and the arm64 target.
      - name: install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      # The ingest tests open PDFs with pdfium. The script downloads the pinned build and prints
      # where the library is.
      - name: fetch pdfium for the tests
        run: echo "OPENBOOK_PDFIUM_PATH=$(scripts/fetch-pdfium.sh linux-x64)" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The offline retrieval evaluation (docs/evaluation.md): the real chunker, BM25, and fusion on
  # cached pages and embeddings. No AWS and no network. It fails when a hybrid metric
  # drops more than 0.01 below evals/baseline.json, or when gate accuracy drops at all.
  eval:
    name: retrieval evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - run: make eval

  lambda:
    name: arm64 Lambda build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      # pip installs cargo-lambda with the Zig linker it needs to cross-compile for arm64.
      - name: install cargo-lambda
        run: pip3 install "cargo-lambda==${CARGO_LAMBDA_VERSION}" "ziglang==${ZIGLANG_VERSION}"
      - run: make build-lambdas
      - name: both binaries and libpdfium.so exist
        run: |
          test -x target/lambda/openbook-api/bootstrap
          test -x target/lambda/openbook-ingest/bootstrap
          test -s target/lambda/openbook-ingest/libpdfium.so

  rust-integration:
    name: rust integration (AWS Emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - name: fetch pdfium for the tests
        run: echo "OPENBOOK_PDFIUM_PATH=$(scripts/fetch-pdfium.sh linux-x64)" >> "$GITHUB_ENV"
      # Build from the latest RPM, never from a cached layer. `make test-integration` then
      # starts the container as the runner user, on 127.0.0.1 only, with `-a off` and
      # EMULATOR_TELEMETRY=off, waits for /__admin/health with the new CA, runs the ignored
      # tests, and stops the container.
      - name: build the emulator image
        run: docker build --pull --no-cache -t "$EMULATOR_IMAGE" scripts/emulator
      - run: make test-integration

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ask
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ask/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  infra:
    name: infra
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # The synth uses placeholder assets and no AWS identity: the script drops every AWS
      # variable and the CDK CLI finds no account.
      - name: synth with placeholder assets
        run: |
          npm run synth:placeholders
          npm run synth:placeholders -- -c stage=prod

  scripts:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bash -n
        run: |
          for file in scripts/*.sh scripts/lib/stack.sh infra/scripts/*.sh; do
            bash -n "$file"
          done
      - name: shellcheck
        run: shellcheck -x scripts/*.sh scripts/lib/stack.sh infra/scripts/*.sh

  e2e-local:
    name: local end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      # Save the cache even if a later step fails, so that a retry does not compile again.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ask/package-lock.json
      - run: npm ci
        working-directory: apps/ask
      - name: install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/ask
      - name: build the emulator image
        run: docker build --pull --no-cache -t "$EMULATOR_IMAGE" scripts/emulator
      - run: make e2e-local
      - name: keep the Playwright report when the suite fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/ask/playwright-report/
            apps/ask/test-results/
          if-no-files-found: ignore
          retention-days: 7
