# The gate every change passes before it is merged.
#
# Nothing here needs AWS credentials, and no job can ask for an OIDC token, so a pull request
# from a fork can run the whole gate and still reach nothing. Deployment lives in
# deploy.yml, the only workflow that may request an OIDC token.
#
# Third-party actions are pinned to full commit SHAs (the tag is in the comment).
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The emulator image comes from the latest LTS RPM. Docker builds it fresh on every run.
  EMULATOR_IMAGE: aws-emulator

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the toolchain, its components, and the arm64 target.
      - name: install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  rust-integration:
    name: rust integration (AWS Emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Build from the latest RPM, never from a cached layer. `make test-integration` then
      # starts the container on 127.0.0.1 only, with `-a off` and EMULATOR_TELEMETRY=off,
      # waits for /__admin/health, runs the ignored tests, and stops the container.
      - name: build the emulator image
        run: docker build --pull --no-cache -t "$EMULATOR_IMAGE" scripts/emulator
      - run: make test-integration

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ask
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ask/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  infra:
    name: infra
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # The synth uses placeholder assets, a fake account, and no credentials.
      - name: synth with placeholder assets
        env:
          CDK_DEFAULT_ACCOUNT: '111111111111'
        run: |
          npm run synth:placeholders
          npm run synth:placeholders -- -c stage=prod

  e2e-local:
    name: local end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ask/package-lock.json
      - run: npm ci
        working-directory: apps/ask
      - name: install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/ask
      - name: build the emulator image
        run: docker build --pull --no-cache -t "$EMULATOR_IMAGE" scripts/emulator
      - run: make e2e-local
      - name: keep the Playwright report when the suite fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/ask/playwright-report/
            apps/ask/test-results/
          if-no-files-found: ignore
          retention-days: 7
